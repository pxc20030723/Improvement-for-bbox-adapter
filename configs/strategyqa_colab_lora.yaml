task: StrategyQA
train_ratio: 0.9

seed: 42

# MODEL
generator_model: gpt-4o-mini
critic_model: microsoft/deberta-v3-base
add_special_tokens: True

# PARAMETER-EFFICIENT FINETUNING
use_lora: False
lora_r: 16
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - query_proj
  - value_proj
lora_modules_to_save:
lora_bias: none

# MOE HEAD
use_moe_head: True
moe_num_experts: 4
moe_gating_hidden_size: 128
moe_expert_hidden_size: 256
moe_expert_dropout: 0.25
moe_load_balance_coef: 0.0005
moe_entropy_coef: 0.001
moe_top_k: 2


# MODE
critic_mode: classification
score_mode:

# SEARCH PARAMS
beam_size: 2
num_candidates: 4
max_length: 8
early_stopping: True
only_eval_answers: False

# QUERY_PARAMS
temperature: 0.7
frequency_penalty: 0
presence_penalty: 0
stop: ["\n", "\n\n", "\n\n\n"]
max_tokens: 64

# TRAINING_PARAMS
offline_warmup_path:
num_epochs_offline_warmup:

use_blackbox_warmup: True
num_epochs_blackbox_warmup: 1
num_candidates_blackbox_warmup: 4

num_online_finetuning_repeat: 1

num_epochs: 2
batch_size: 16
gradient_accumulation_steps: 1

l2_reg_coef: 1.
energy_temp: 5.
warmup_steps: 10
learning_rate: 1.E-4
min_lr: 1.E-4
T_lr: 1000

use_outcome_supervision: True
num_negatives_for_training: 1
qa_template: "Q: <Q>\n\nA: <A>"

# EVALUATION
eval_blackbox: False
eval_unfinetuned: False
num_eval_rounds: 1

log_with_wandb: True

# LOW-COST COLAB SUBSETS
max_train_samples: 64
max_eval_samples: 32

